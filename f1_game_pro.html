<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>F1 Grand Prix - Real Track & AI Opponents</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    #start-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(10,10,15,0.95), rgba(225,6,0,0.6));
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      cursor: pointer;
      text-align: center;
    }

    #start-screen h1 {
      font-size: 56px;
      margin: 0 0 10px 0;
      color: #fff;
      text-shadow: 0 0 20px #e10600;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .start-btn {
      margin-top: 25px;
      padding: 15px 40px;
      background: #e10600;
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      border-radius: 50px;
      border: none;
      box-shadow: 0 0 25px rgba(225, 6, 0, 0.8);
    }

    /* Telemetry HUD */
    #f1-hud {
      position: absolute;
      bottom: 25px;
      right: 25px;
      background: rgba(15, 15, 20, 0.9);
      border: 2px solid #e10600;
      border-radius: 12px;
      padding: 15px 25px;
      color: white;
      display: flex;
      gap: 20px;
      align-items: center;
      box-shadow: 0 0 20px rgba(225, 6, 0, 0.4);
      z-index: 10;
    }

    .hud-block { text-align: center; }
    .hud-val { font-size: 34px; font-weight: 900; color: #fff; font-family: 'Impact', sans-serif; }
    .hud-lbl { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    #gear-val { color: #e10600; font-size: 44px; }

    #position-board {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      border-left: 4px solid #e10600;
      padding: 15px 20px;
      border-radius: 4px;
      color: #fff;
      z-index: 10;
      min-width: 180px;
    }

    .pos-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="start-screen" onclick="startGame()">
    <h1>🏁 F1 GRAND PRIX 🏎️</h1>
    <p style="font-size: 20px;">Race against 3 AI Bot Drivers on a real F1 Circuit!</p>
    <div class="start-btn">CLICK TO RACE</div>
    <p style="color: #ddd; margin-top: 15px;">Controls: <strong>W/S/A/D</strong> or <strong>Arrow Keys</strong></p>
  </div>

  <div id="position-board">
    <div style="font-size: 16px; font-weight: 900; color: #e10600; margin-bottom: 10px;">RACE STANDINGS</div>
    <div class="pos-row"><span>1. <span id="p1-name">BOT 1</span></span> <span id="p1-gap">LEADER</span></div>
    <div class="pos-row"><span>2. <span id="p2-name">YOU</span></span> <span id="p2-gap">+0.4s</span></div>
    <div class="pos-row"><span>3. <span id="p3-name">BOT 2</span></span> <span id="p3-gap">+1.2s</span></div>
    <div class="pos-row"><span>4. <span id="p4-name">BOT 3</span></span> <span id="p4-gap">+2.5s</span></div>
  </div>

  <div id="f1-hud">
    <div class="hud-block"><div id="gear-val" class="hud-val">1</div><div class="hud-lbl">Gear</div></div>
    <div class="hud-block"><div id="speed-val" class="hud-val">0</div><div class="hud-lbl">KM/H</div></div>
    <div class="hud-block"><div id="lap-val" class="hud-val">00:00.000</div><div class="hud-lbl">Lap Time</div></div>
  </div>

  <script>
    function startGame() {
      document.getElementById('start-screen').style.display = 'none';
      window.focus();
    }

    // 1. SCENE & LIGHTING SETUP
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7ec0ee);
    scene.fog = new THREE.FogExp2(0x7ec0ee, 0.003);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xffffff, 0.9);
    sun.position.set(100, 150, 50);
    sun.castShadow = true;
    scene.add(sun);

    // Ground Plane
    const grassGeo = new THREE.PlaneGeometry(2000, 2000);
    const grassMat = new THREE.MeshLambertMaterial({ color: 0x3b7a3b });
    const grass = new THREE.Mesh(grassGeo, grassMat);
    grass.rotation.x = -Math.PI / 2;
    scene.add(grass);

    // 2. REAL CIRCUIT WAYPOINTS (TRACK PATH)
    const trackWaypoints = [
      new THREE.Vector3(0, 0, -150),
      new THREE.Vector3(0, 0, 100),    // Main Straight
      new THREE.Vector3(40, 0, 160),   // Turn 1 Sweeper
      new THREE.Vector3(120, 0, 150), 
      new THREE.Vector3(160, 0, 60),   // Turn 2 Hairpin
      new THREE.Vector3(100, 0, -20), 
      new THREE.Vector3(180, 0, -100), // Chicane Entry
      new THREE.Vector3(120, 0, -180), // Back Straight
      new THREE.Vector3(-80, 0, -200),
      new THREE.Vector3(-140, 0, -100),// Final Corner
      new THREE.Vector3(-80, 0, -50),
    ];

    const curve = new THREE.CatmullRomCurve3(trackWaypoints, true);
    
    // Draw Asphalt Track Mesh
    const trackGeo = new THREE.TubeGeometry(curve, 200, 14, 8, true);
    const trackMat = new THREE.MeshStandardMaterial({ color: 0x222225, roughness: 0.8 });
    const trackMesh = new THREE.Mesh(trackGeo, trackMat);
    trackMesh.scale.set(1, 0.01, 1); // Flatten tube into road track
    scene.add(trackMesh);

    // Grandstands
    const standGeo = new THREE.BoxGeometry(15, 10, 80);
    const standMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
    const stand = new THREE.Mesh(standGeo, standMat);
    stand.position.set(-25, 5, -20);
    scene.add(stand);

    // 3. CAR BUILDER FACTORY
    function createF1Car(colorHex) {
      const car = new THREE.Group();

      // Body / Cockpit
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 0.45, 3.6),
        new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.2 })
      );
      body.position.y = 0.35;
      car.add(body);

      // Front Wing
      const fWing = new THREE.Mesh(
        new THREE.BoxGeometry(2.2, 0.08, 0.6),
        new THREE.MeshStandardMaterial({ color: 0x111111 })
      );
      fWing.position.set(0, 0.15, -1.8);
      car.add(fWing);

      // Rear Wing
      const rWing = new THREE.Mesh(
        new THREE.BoxGeometry(1.8, 0.5, 0.4),
        new THREE.MeshStandardMaterial({ color: 0x111111 })
      );
      rWing.position.set(0, 0.75, 1.6);
      car.add(rWing);

      // Halo Safety Ring
      const halo = new THREE.Mesh(
        new THREE.TorusGeometry(0.3, 0.05, 8, 16, Math.PI),
        new THREE.MeshStandardMaterial({ color: 0x111111 })
      );
      halo.rotation.x = -Math.PI / 2;
      halo.position.set(0, 0.6, -0.2);
      car.add(halo);

      // Wheels
      const wGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.4, 24);
      const wMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.9 });
      [[-1.0, 0.38, -1.1], [1.0, 0.38, -1.1], [-1.0, 0.38, 1.1], [1.0, 0.38, 1.1]].forEach(p => {
        const w = new THREE.Mesh(wGeo, wMat);
        w.rotation.z = Math.PI / 2;
        w.position.set(...p);
        car.add(w);
      });

      return car;
    }

    // Player Car (Red Ferrari)
    const playerCar = createF1Car(0xe10600);
    playerCar.position.set(2, 0, -120);
    scene.add(playerCar);

    // AI Bot Cars (3 Rivals)
    const aiBots = [
      { mesh: createF1Car(0xffd700), progress: 0.08, speed: 0.00048, name: "VERSTAPPEN" }, // Yellow
      { mesh: createF1Car(0x00d2be), progress: 0.05, speed: 0.00045, name: "HAMILTON" },   // Blue/Cyan
      { mesh: createF1Car(0xff8700), progress: 0.02, speed: 0.00042, name: "NORRIS" }     // Orange
    ];

    aiBots.forEach(bot => scene.add(bot.mesh));

    // 4. CONTROLS
    let speed = 0;
    const maxSpeed = 1.6;
    const accel = 0.022;
    const keys = { forward: false, backward: false, left: false, right: false };

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) keys.forward = true;
      if (['ArrowDown', 'KeyS'].includes(e.code)) keys.backward = true;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = true;
      if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = true;
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
    });

    window.addEventListener('keyup', e => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) keys.forward = false;
      if (['ArrowDown', 'KeyS'].includes(e.code)) keys.backward = false;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
      if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
    });

    // 5. GAME LOOP
    const startTime = Date.now();

    function animate() {
      requestAnimationFrame(animate);

      // Player Movement
      if (keys.forward) speed = Math.min(speed + accel, maxSpeed);
      if (keys.backward) speed = Math.max(speed - accel * 1.5, -maxSpeed / 3);
      speed *= 0.985; // Friction

      if (keys.left) playerCar.rotation.y += 0.035;
      if (keys.right) playerCar.rotation.y -= 0.035;

      playerCar.translateZ(-speed);

      // AI Bots Pathfinding Logic
      aiBots.forEach(bot => {
        bot.progress = (bot.progress + bot.speed) % 1;
        const currentPos = curve.getPointAt(bot.progress);
        const lookAheadPos = curve.getPointAt((bot.progress + 0.01) % 1);

        bot.mesh.position.copy(currentPos);
        bot.mesh.lookAt(lookAheadPos);
      });

      // Camera Follow
      const cameraOffset = new THREE.Vector3(0, 3.8, 7.5).applyMatrix4(playerCar.matrixWorld);
      camera.position.copy(cameraOffset);
      camera.lookAt(playerCar.position.x, playerCar.position.y + 0.5, playerCar.position.z);

      // Telemetry HUD Update
      const kmh = Math.round(Math.abs(speed) * 230);
      document.getElementById('speed-val').textContent = kmh;

      let gear = 1;
      if (kmh > 280) gear = 8;
      else if (kmh > 230) gear = 7;
      else if (kmh > 180) gear = 6;
      else if (kmh > 140) gear = 5;
      else if (kmh > 90)  gear = 4;
      else if (kmh > 50)  gear = 3;
      else if (kmh > 15)  gear = 2;
      document.getElementById('gear-val').textContent = gear;

      const elapsed = Date.now() - startTime;
      const mins = Math.floor(elapsed / 60000).toString().padStart(2, '0');
      const secs = Math.floor((elapsed % 60000) / 1000).toString().padStart(2, '0');
      const millis = (elapsed % 1000).toString().padStart(3, '0');
      document.getElementById('lap-val').textContent = `${mins}:${secs}.${millis}`;

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
